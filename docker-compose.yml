version: '3.8'

services:
  frontend:
    build:
      context: .
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - "9620:80"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  backend:
    build:
      context: ./server
    ports:
      - "9640:9640"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SCHEMA=${SUPABASE_SCHEMA:-dlabs}
      - JWT_SECRET=${JWT_SECRET}
